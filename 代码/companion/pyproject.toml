[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "life-health-companion"
version = "0.1.1"
description = "Private Windows relay for the Life Health Planner Android app"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "openai>=1.99,<3",
  "keyring>=25.6,<26",
  "qrcode[pil]>=8.2,<9",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
life-health-companion = "life_companion.cli:main"

[tool.setuptools.packages.find]
include = ["life_companion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"life_companion/app.py" = ["B008"]
